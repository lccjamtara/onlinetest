<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lakhotiya Computer Center | Online Tests</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f9;
      color: #333;
    }
    header {
      background: linear-gradient(135deg, #003366, #0073e6);
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    main {
      max-width: 900px;
      margin: 20px auto;
      padding: 10px;
    }
    .test-card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .test-card h2 {
      color: #003366;
      margin-bottom: 10px;
      text-align: center;
    }
    .set-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .set-list a {
      background: #0073e6;
      color: #fff;
      padding: 10px;
      text-align: center;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
    .set-list a:hover {
      background: #005bb5;
    }
    footer {
      text-align: center;
      background: #003366;
      color: #fff;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>
